          import android.media.AudioTrack
          object Snd {
              private val rnd = java.util.Random()
              fun play(f0: Float, f1: Float, dur: Float, noise: Float = 0.3f, vib: Float = 0f, vol: Float = 0.8f) {
                  Thread {
                      val sr = 22050; val n = (sr * dur).toInt(); val b = ShortArray(n); var ph = 0.0
                      for (i in 0 until n) {
                          val t = i / n.toDouble()
                          val f = f0 + (f1 - f0) * t + vib * Math.sin(t * 40.0) * 30.0
                          ph += 2 * Math.PI * f / sr
                          val env = Math.pow(1.0 - t, 1.4) * Math.min(1.0, t * 30.0)
                          val s = (Math.sin(ph) + 0.5 * Math.sin(2 * ph) + 0.25 * Math.sin(3 * ph) + noise * (rnd.nextDouble() - 0.5)) * env
                          b[i] = (s * 8000 * vol).toInt().toShort()
                      }
                      try {
                          val at = AudioTrack(AudioManager.STREAM_MUSIC, sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT, n * 2, AudioTrack.MODE_STATIC)
                          at.write(b, 0, n); at.play(); Thread.sleep((dur * 1000).toLong() + 100); at.release()
                      } catch (e: Exception) {}
                  }.start()
              }
              fun bark(big: Float) = play(900f - 500f * big, 450f - 250f * big, 0.12f + 0.08f * big, 0.5f - 0.2f * big)
              fun yip() = play(1100f, 1500f, 0.1f, 0.15f)
              fun whine() = play(900f, 500f, 0.5f, 0.05f, 1f)
              fun eat() { repeat(4) { i -> Thread { Thread.sleep(i * 130L); play(300f, 200f, 0.05f, 1.5f, 0f, 0.5f) }.start() } }
              fun splash() = play(500f, 300f, 0.25f, 3f, 0f, 0.4f)
              fun happy() = play(1000f, 1700f, 0.18f, 0.1f, 1f)
          }
