                  Pers("Presumida elegante", 0.5f, 0.5f, 0.3f, 0.6f, 0.5f))
              val intE = listOf("🎾", "🏃", "👃", "🥰", "😤", "😨", "😒")
              val intN = listOf("quiere jugar", "persigue", "olfatea", "quiere acurrucarse", "reta", "huye", "ignora")
              val fBase = listOf("Croquetas", "Pollo", "Carne", "Pescado", "Huevo", "Arroz", "Zanahoria", "Manzana", "Plátano", "Queso", "Galleta", "Hueso", "Salchicha", "Pavo", "Avena", "Calabaza", "Arándanos", "Sandía", "Yogur", "Helado canino")
              val fPrep = listOf("al vapor", "a la plancha", "hervido", "en cubitos", "triturado", "con caldo", "con arroz", "con huevo", "con verduras", "en sopa", "crujiente", "con miel", "congelado", "en puré", "con queso", "gourmet")
              val fx = listOf("❤️", "⭐", "💦", "🎵", "💤", "✨", "🫧", "💢", "❓", "❗", "🍖", "🦴", "🎾", "🌸", "💫", "☁️", "🔥", "🌈", "👏", "🎉")
              val cats = listOf(
                  Cx("🤚 Caricias", "¿Cómo?", listOf("la cabeza", "las orejas", "la barriga", "el lomo", "las patitas", "el hocico", "la colita", "las mejillas", "el cuello", "el pecho", "la espalda", "los bigotes").map { "Acariciar $it" }, listOf("suavemente", "rápido", "con cosquillas", "con masaje")),
                  Cx("🎾 Jugar", "¿Cómo?", listOf("la pelota", "el hueso", "el frisbee", "la cuerda", "el peluche", "la pelota chillona", "el aro", "la cometa", "las burbujas", "el espejo", "el tambor", "el cohete", "el cono", "las cajas", "el silbato").map { "Jugar con $it" }, listOf("lanzar", "esconder", "jalar", "perseguir", "bailar")),
                  Cx("🎓 Trucos", "Nivel", listOf("Sentarse", "Dar la pata", "Rodar", "Hacerse el muerto", "Saltar", "Bailar", "Girar", "Saludar", "Hablar", "Caminar en dos patas", "Dar vueltas", "Dar un besito", "Ladrar", "Aullar", "Gatear", "Inclinarse", "Esconderse", "Reverencia", "Parada de manos", "Saltar el aro"), listOf("fácil", "medio", "de show")),
                  Cx("🛁 Baño", "Tipo", listOf("Mojar", "Enjabonar", "Champú", "Masaje de espuma", "Enjuagar", "Secar con toalla", "Secador", "Cepillar", "Perfume", "Lazo final"), listOf("normal", "extra")),
                  Cx("😴 Cuidados", "", listOf("Llevar a la cama", "Cuna acolchada", "Arrullo", "Nana", "Cobijita", "Luz tenue", "Peluche", "Buenas noches"), listOf("")),
                  Cx("🌳 Paseos", "", listOf("Parque", "Playa", "Bosque", "Ciudad", "Nieve", "Montaña", "Río", "Jardín", "Campo", "Heladería").map { "Paseo: $it" }, listOf("")))
              val slots = listOf("🎩 Sombrero", "👕 Camisa", "🕶️ Lentes", "🎀 Cuello", "🦸 Espalda", "👢 Pies", "🌸 Orejas")
              val nShapes = intArrayOf(24, 18, 8, 8, 6, 4, 4)
              val colors = listOf("rojo" to 0xFFE53935.toInt(), "azul" to 0xFF1E88E5.toInt(), "amarillo" to 0xFFFDD835.toInt(), "verde" to 0xFF43A047.toInt(), "rosa" to 0xFFF48FB1.toInt(), "morado" to 0xFF8E24AA.toInt(), "naranja" to 0xFFFB8C00.toInt())
              val total = nShapes.sum() * 7
              fun shapeName(sl: Int, s: Int): String = when (sl) {
                  0 -> (if ((s / 3) % 2 == 1) "Sombrero " else "Gorro ") + listOf("bajo", "medio", "alto")[s % 3] + listOf("", " con pompón", " con pluma", " con flor")[(s / 6) % 4]
                  1 -> "Camisa " + listOf("lisa", "a rayas", "de lunares", "a cuadros", "de aros", "de estrellas")[s % 6] + listOf(" redonda", " cuello V", " con cuello")[(s / 6) % 3]
                  2 -> "Lentes " + listOf("redondos", "cuadrados", "de corazón", "de estrella", "visor", "monóculo", "de sol", "3D")[s]
                  3 -> listOf("Moño", "Bufanda", "Pañuelo", "Collar con campana", "Corbata", "Collar de perlas", "Babero", "Collar de flores")[s]
                  4 -> listOf("Capa corta", "Capa larga", "Alas", "Mochila", "Alas de hada", "Tutú")[s]
                  5 -> listOf("Botas", "Calcetines", "Zapatos", "Patines")[s]
                  else -> listOf("Moño de oreja", "Flor de oreja", "Diadema", "Pasador")[s]
              }
              fun dk(c: Int) = ((c shr 1) and 0x7F7F7F) or (0xFF shl 24)
              fun motion(m: Int, p: Float): FloatArray {
                  val pi = PI.toFloat(); val t = 2 * pi * p; val r = floatArrayOf(0f, 0f, 0f, 1f, 1f)
                  when (m % 22) {
                      0 -> r[1] = -abs(sin(pi * p)) * 0.5f
                      1 -> r[1] = -abs(sin(t)) * 0.4f
                      2 -> r[2] = 360f * p
                      3 -> { r[2] = 360f * p; r[1] = -sin(pi * p) * 0.3f }
                      4 -> { r[4] = 1 + 0.15f * sin(4 * t); r[3] = 1 - 0.1f * sin(4 * t) }
                      5 -> r[0] = 0.03f * sin(20 * t)
                      6 -> r[2] = 10f * sin(2 * t)
                      7 -> r[4] = 1 + 0.2f * sin(pi * p)
                      8 -> { r[4] = 1 - 0.2f * sin(pi * p); r[3] = 1 + 0.1f * sin(pi * p) }
                      9 -> r[2] = 15f * sin(t)
                      10 -> r[0] = 0.25f * sin(t)
                      11 -> { r[0] = 0.2f * sin(t); r[1] = -0.1f * (1 - cos(t)) }
                      12 -> r[0] = 0.25f * sin(t) * cos(6 * t)
                      13 -> r[0] = -0.2f * sin(pi * p)
                      14 -> r[0] = 0.2f * sin(pi * p)
                      15 -> r[4] = 1 + 0.04f * sin(3 * t)
                      16 -> { r[2] = 720f * p; r[0] = 0.4f * (p - 0.5f) }
                      17 -> r[2] = -20f * sin(pi * p)
                      18 -> { r[0] = 0.1f * sin(4 * t); r[2] = 8f * sin(4 * t) }
                      19 -> { r[3] = 1 + 0.1f * sin(5 * t); r[4] = r[3] }
                      20 -> r[1] = -0.5f * (1 - p) * (1 - p)
                      else -> r[2] = 6f * sin(6 * t)
                  }
                  return r
              }
              fun wear(c: Canvas, p: Paint, o: IntArray, side: Boolean, x0: Float, y0: Float, w: Float, h: Float, pass: Int) {
                  val hx = x0 + (if (side) 0.8f else 0.5f) * w; val hTop = y0 + 0.04f * h; val hW = (if (side) 0.3f else 0.44f) * w
                  val nx = x0 + (if (side) 0.68f else 0.5f) * w; val nY = y0 + (if (side) 0.3f else 0.36f) * h
                  val tl = x0 + (if (side) 0.25f else 0.3f) * w; val tt = y0 + (if (side) 0.34f else 0.4f) * h
                  val tr = x0 + (if (side) 0.65f else 0.7f) * w; val tb = y0 + (if (side) 0.66f else 0.78f) * h
                  val fy = y0 + (if (side) 0.95f else 0.97f) * h; val f1 = x0 + (if (side) 0.3f else 0.38f) * w; val f2 = x0 + (if (side) 0.62f else 0.62f) * w
                  val d = hW / 10f
                  fun r(l: Float, t: Float, rr: Float, b: Float, col: Int) { p.style = Paint.Style.FILL; p.color = col; c.drawRect(l, t, rr, b, p) }
                  fun o2(x: Float, y: Float, rad: Float, col: Int) { p.style = Paint.Style.FILL; p.color = col; c.drawCircle(x, y, rad, p) }
                  fun ring(x: Float, y: Float, rad: Float, col: Int) { p.style = Paint.Style.STROKE; p.strokeWidth = max(2f, d * 0.5f); p.color = col; c.drawCircle(x, y, rad, p); p.style = Paint.Style.FILL }
                  fun it(sl: Int): Int = o[sl]
                  if (pass == 0) {
                      if (it(4) >= 0) { val s = it(4) / 7; val col = D.colors[it(4) % 7].second; val q = (tr - tl) * 0.15f
                          when (s) { 0 -> r(tl - q, tt - d, tr + q, tb, col); 1 -> r(tl - q, tt - d, tr + q, fy, col)
                              2 -> { o2(tl - d, tt + d, d * 2.5f, Color.WHITE); o2(tr + d, tt + d, d * 2.5f, Color.WHITE) }
                              3 -> r(tl - d * 2, tt, tl + d, tb - d * 2, col)
                              4 -> { o2(tl - d, tt, d * 2.5f, col); o2(tr + d, tt, d * 2.5f, col) }
                              else -> r(tl - d * 2, tb - d * 1.5f, tr + d * 2, tb, col) } }
                      return
                  }
                  if (it(5) >= 0) { val s = it(5) / 7; val col = D.colors[it(5) % 7].second
                      for (fx in floatArrayOf(f1, f2)) when (s) { 0 -> r(fx - d * 1.2f, fy - d * 2.5f, fx + d * 1.2f, fy, col); 1 -> r(fx - d * 1.2f, fy - d * 1.5f, fx + d * 1.2f, fy, col)
                          2 -> r(fx - d * 1.4f, fy - d * 0.9f, fx + d * 1.4f, fy, col); else -> { r(fx - d * 1.4f, fy - d * 0.9f, fx + d * 1.4f, fy, col); r(fx - d * 1.4f, fy, fx + d * 1.4f, fy + d * 0.3f, Color.GRAY) } } }
                  if (it(1) >= 0) { val s = it(1) / 7; val col = D.colors[it(1) % 7].second; val wd = tr - tl; val ht = tb - tt
                      r(tl, tt, tr, tb, col)
                      when (s % 6) {
                          1 -> for (i in 0..3) r(tl, tt + ht * (2 * i + 1) / 8f, tr, tt + ht * (2 * i + 2) / 8f, dk(col))
                          2 -> for (i in 0..2) for (j in 0..2) o2(tl + wd * (i + 0.5f) / 3f, tt + ht * (j + 0.5f) / 3f, wd / 14f, Color.WHITE)
                          3 -> for (i in 1..3) { r(tl + wd * i / 4f - 1, tt, tl + wd * i / 4f + 1, tb, dk(col)); r(tl, tt + ht * i / 4f - 1, tr, tt + ht * i / 4f + 1, dk(col)) }
                          4 -> for (i in 0..2) r(tl, tt + ht * (2 * i + 1) / 6f, tr, tt + ht * (2 * i + 2) / 6f, Color.WHITE)
                          5 -> for (i in 0..2) for (j in 0..2) o2(tl + wd * (i + 0.5f) / 3f, tt + ht * (j + 0.5f) / 3f, wd / 22f, 0xFFFFEB3B.toInt())
                      }
                      when ((s / 6) % 3) { 1 -> r(nx - wd * 0.12f, tt, nx + wd * 0.12f, tt + ht * 0.2f, Color.WHITE); 2 -> { r(tl, tt, tl + wd * 0.25f, tt + ht * 0.15f, Color.WHITE); r(tr - wd * 0.25f, tt, tr, tt + ht * 0.15f, Color.WHITE) } } }
                  if (it(3) >= 0) { val s = it(3) / 7; val col = D.colors[it(3) % 7].second
                      when (s) { 0 -> { r(nx - d * 2.2f, nY - d * 0.8f, nx - d * 0.3f, nY + d * 0.8f, col); r(nx + d * 0.3f, nY - d * 0.8f, nx + d * 2.2f, nY + d * 0.8f, col); o2(nx, nY, d * 0.5f, dk(col)) }
                          1 -> { r(nx - d * 3.5f, nY - d * 0.6f, nx + d * 3.5f, nY + d * 0.8f, col); r(nx + d * 1.5f, nY, nx + d * 2.7f, nY + d * 3, col) }
                          2 -> { p.color = col; p.style = Paint.Style.FILL; c.drawPath(Path().apply { moveTo(nx - d * 3.5f, nY - d * 0.5f); lineTo(nx + d * 3.5f, nY - d * 0.5f); lineTo(nx, nY + d * 3); close() }, p) }
                          3 -> { r(nx - d * 3.5f, nY - d * 0.5f, nx + d * 3.5f, nY + d * 0.5f, col); o2(nx, nY + d * 0.8f, d * 0.8f, 0xFFFFD54F.toInt()) }
                          4 -> { r(nx - d * 0.5f, nY, nx + d * 0.5f, nY + d * 3, col); o2(nx, nY, d * 0.7f, dk(col)) }
                          5 -> for (i in -3..3) o2(nx + i * d, nY + abs(i) * d * 0.15f, d * 0.45f, Color.WHITE)
                          6 -> { r(nx - d * 2.5f, nY, nx + d * 2.5f, nY + d * 3.5f, Color.WHITE); r(nx - d * 2.5f, nY + d * 3f, nx + d * 2.5f, nY + d * 3.5f, col) }
                          else -> for (i in -3..3 step 2) { o2(nx + i * d, nY, d * 0.6f, col); o2(nx + i * d, nY, d * 0.25f, 0xFFFFEB3B.toInt()) } } }
                  if (it(6) >= 0) { val s = it(6) / 7; val col = D.colors[it(6) % 7].second; val ey = hTop + hW * 0.35f
                      val xs = if (side) floatArrayOf(hx - hW * 0.2f) else floatArrayOf(hx - hW * 0.5f, hx + hW * 0.5f)
                      for (x in xs) when (s) { 0 -> { o2(x - d, ey, d, col); o2(x + d, ey, d, col); o2(x, ey, d * 0.5f, dk(col)) }
                          1 -> { for (k in 0..4) o2(x + cos(k * 1.2566f) * d * 1.1f, ey + sin(k * 1.2566f) * d * 1.1f, d * 0.7f, col); o2(x, ey, d * 0.6f, 0xFFFFEB3B.toInt()) }
                          2 -> {}
                          else -> r(x - d * 0.6f, ey - d * 0.4f, x + d * 0.6f, ey + d * 0.4f, col) }
                      if (s == 2) r(hx - hW * 0.45f, hTop + d * 0.5f, hx + hW * 0.45f, hTop + d * 1.4f, col) }
                  if (it(2) >= 0) { val s = it(2) / 7; val col = D.colors[it(2) % 7].second; val ey = hTop + hW * 0.52f; val rad = hW * 0.14f
                      val a = if (side) hx else hx - hW * 0.22f; val b = if (side) hx + hW * 0.3f else hx + hW * 0.22f
                      when (s) { 0 -> { ring(a, ey, rad, col); ring(b, ey, rad, col) }
                          1 -> { for (x in floatArrayOf(a, b)) { p.style = Paint.Style.STROKE; p.strokeWidth = max(2f, d * 0.5f); p.color = col; c.drawRect(x - rad, ey - rad, x + rad, ey + rad, p); p.style = Paint.Style.FILL } }
                          2 -> { for (x in floatArrayOf(a, b)) { o2(x - rad * 0.4f, ey - rad * 0.2f, rad * 0.6f, 0xFFFF4081.toInt()); o2(x + rad * 0.4f, ey - rad * 0.2f, rad * 0.6f, 0xFFFF4081.toInt()); o2(x, ey + rad * 0.3f, rad * 0.6f, 0xFFFF4081.toInt()) } }
                          3 -> { for (x in floatArrayOf(a, b)) { o2(x, ey, rad, 0xFFFFD600.toInt()); o2(x, ey, rad * 0.4f, col) } }
