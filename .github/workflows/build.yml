          package com.example.perrita
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.*
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.*

          class Pt(var e: String, var x: Float, var y: Float, var vy: Float, var life: Float)
          class PD(val bi: Int) { var x = 0.5f; var y = 0.7f; var dir = 1; var ia = 6; var until = 0L; var tg = -1; var say = ""; var sayT = 0L; var walking = false; var lastFx = 0L }

          class GameView(c: Context) : View(c) {
              private val p = Paint(); private val tp = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = java.util.Random()
              var breed = 0; var name = "Perrita"; var birth = System.currentTimeMillis(); var last = System.currentTimeMillis()
              val st = floatArrayOf(80f, 80f, 80f, 80f); val outfit = IntArray(7) { -1 }
              private var px = 0.5f; private var dir = 1; private var mode = "idle"; private var modeEnd = 0L; private var target = 0.5f
              private var aM = -1; private var aFx = 0; private var aStart = 0L; private var bath = false; private var sleeping = false
              private val pts = ArrayList<Pt>(); private var lastT = SystemClock.uptimeMillis(); private var lastSp = 0L
              var park = false; val inPark = BooleanArray(7) { true }; private val dogs = ArrayList<PD>()
              private val aff = Array(7) { FloatArray(7) }
              var toast: (String) -> Unit = {}

              fun days() = (System.currentTimeMillis() - birth) / 86400000f
              fun stage(): String { val d = days(); return if (d < 3) "Bebé" else if (d < 10) "Cachorra" else if (d < 14) "Joven" else "Adulta" }
              private fun bigF() = D.breeds[breed].big * (if (days() >= 10) 1f else 0.35f)
              private fun up(i: Int, v: Float) { st[i] = min(100f, max(5f, st[i] + v)) }

              fun grow() { birth -= 86400000L }
              fun newPet(i: Int) { breed = i; if (park) setPark(true) }
              fun randomOutfit() { for (s in 0..6) outfit[s] = if (rnd.nextInt(3) == 0) -1 else rnd.nextInt(D.nShapes[s]) * 7 + rnd.nextInt(7) }

              fun feed(a: Int, b: Int) {
                  up(0, 18f + (a * 7 + b * 3) % 24); up(1, ((a * 5 + b) % 12).toFloat()); if (a % 5 == 3) up(3, -4f)
                  val fav = (breed * 3 + a) % 5 == 0; if (fav) up(1, 10f)
                  toast("${D.fBase[a]} ${D.fPrep[b]}" + (if (fav) " ¡Su favorita! 😍" else " 😋"))
                  Snd.eat(); sleeping = false; aM = (a + b) % 22; aFx = 10 + (a + b) % 3; aStart = SystemClock.uptimeMillis()
              }

              fun act(cat: Int, a: Int, b: Int) {
                  val id = a * 7 + b * 3 + cat * 5; sleeping = false; bath = false
                  aM = id % 22; aFx = (id / 3 + cat * 3) % 20; aStart = SystemClock.uptimeMillis()
                  when (cat) {
                      0 -> { up(1, 8f); Snd.happy(); aFx = 0 }
                      1 -> { up(1, 10f); up(2, -8f); up(0, -5f); Snd.bark(bigF()) }
                      2 -> { up(1, 6f); up(2, -6f); if (days() < 10) Snd.yip() else Snd.bark(bigF()) }
                      3 -> { bath = true; up(3, 25f); up(1, 2f); Snd.splash(); aFx = 6 }
                      4 -> { sleeping = true; aM = -1; Snd.whine() }
                      else -> { up(1, 12f); up(2, -10f); up(3, -8f); Snd.happy() }
                  }
                  toast(D.cats[cat].a[a] + (if (D.cats[cat].b.size > 1) " · " + D.cats[cat].b[b] else ""))
              }

              fun setPark(on: Boolean) {
                  park = on; dogs.clear(); if (!on) return
                  for (i in 0..6) if (inPark[i] || i == breed) { val d = PD(i); d.x = 0.1f + 0.8f * rnd.nextFloat(); d.y = 0.62f + 0.25f * rnd.nextFloat(); d.until = 0L; dogs.add(d) }
              }

              private fun decide(d: PD, now: Long) {
                  val o2 = dogs.filter { it !== d }; if (o2.isEmpty()) return
                  val tg = o2[rnd.nextInt(o2.size)]; val P = D.pers[d.bi]; val o = D.pers[tg.bi]; val a = aff[d.bi][tg.bi]
                  val w = listOf(P.soc * P.ene * (1 + a), P.ene * (1 - P.ter * 0.5f) * (0.4f + P.dom), P.soc * 0.7f + 0.2f,
                      P.ter * P.soc * (1 + a) * (if (o.ter > 0.4f) 1f else 0.3f), P.dom * P.bra * (if (P.dom > o.dom) 1.2f else 0.3f),
                      (1 - P.bra) * (0.3f + o.dom) * (1 - a * 0.5f), (1 - P.soc) * 1.2f + 0.15f).map { max(0.01f, it) }
                  var r = rnd.nextFloat() * w.sum(); var k = w.size - 1
                  for (i in w.indices) { r -= w[i]; if (r <= 0) { k = i; break } }
                  d.ia = k; d.tg = tg.bi; d.until = now + 4000 + rnd.nextInt(3000); d.say = D.intE[k]; d.sayT = now + 2500
              }
              private fun react(t: PD, ia: Int, from: PD, now: Long) { t.ia = ia; t.tg = from.bi; t.until = now + 3500; t.say = D.intE[ia]; t.sayT = now + 2200 }
              private fun reach(d: PD, t: PD, now: Long) {
                  d.lastFx = now; val P = D.pers[d.bi]; val o = D.pers[t.bi]; var dA = 0f
                  when (d.ia) {
                      0 -> if (o.soc > 0.4f) { react(t, 0, d, now); dA = 0.15f } else { react(t, 6, d, now); dA = -0.05f }
                      1 -> if (o.ene > 0.6f) { react(t, 1, d, now); dA = 0.05f } else { react(t, 5, d, now); dA = -0.1f }
                      2 -> { react(t, if (o.soc > 0.6f) 2 else 6, d, now); dA = 0.03f }
                      3 -> if (o.ter > 0.4f) { react(t, 3, d, now); dA = 0.25f } else { react(t, 6, d, now); dA = -0.05f }
                      4 -> if (o.bra > 0.6f) { react(t, 4, d, now); dA = -0.2f } else { react(t, 5, d, now); dA = -0.1f }
                  }
                  aff[d.bi][t.bi] = max(-1f, min(1f, aff[d.bi][t.bi] + dA)); aff[t.bi][d.bi] = max(-1f, min(1f, aff[t.bi][d.bi] + dA * 0.7f))
                  if (d.bi == breed || t.bi == breed) { if (d.ia == 4) Snd.bark(D.breeds[d.bi].big) else if (d.ia == 0 || d.ia == 3) Snd.yip() }
              }

              private fun parkTick(now: Long, dt: Float) {
                  for (d in dogs) {
                      val P = D.pers[d.bi]; if (now > d.until) decide(d, now)
                      val tg = dogs.firstOrNull { it.bi == d.tg }; var vx = 0f; var vy = 0f; val sp = 0.05f + 0.1f * P.ene
                      if (d.ia in 0..4 && tg != null) {
                          val dx = tg.x - d.x; val dy = tg.y - d.y; val dist = max(0.001f, hypot(dx, dy)); val want = if (d.ia == 3 || d.ia == 2) 0.07f else 0.1f
                          if (dist > want) { val k = if (d.ia == 1) 1.6f else 1f; vx = dx / dist * sp * k; vy = dy / dist * sp * k * 0.6f } else if (now - d.lastFx > 1800) reach(d, tg, now)
                      } else if (d.ia == 5 && tg != null) {
                          val dx = d.x - tg.x; val dy = d.y - tg.y; val dist = max(0.01f, hypot(dx, dy)); vx = dx / dist * sp * 1.7f; vy = dy / dist * sp
                      } else vx = d.dir * sp * 0.3f
                      d.x = max(0.08f, min(0.92f, d.x + vx * dt)); d.y = max(0.6f, min(0.9f, d.y + vy * dt))
                      if (abs(vx) > 0.002f) d.dir = if (vx > 0) 1 else -1
                      if (d.x <= 0.08f || d.x >= 0.92f) d.dir = -d.dir
                      d.walking = abs(vx) + abs(vy) > 0.004f
                  }
              }

              private fun tick(now: Long, W: Float, H: Float) {
                  val dt = min(0.1f, (now - lastT) / 1000f); lastT = now
                  st[0] = max(10f, st[0] - 0.25f / 60 * dt); st[1] = max(10f, st[1] - 0.2f / 60 * dt); st[2] = max(10f, st[2] - 0.15f / 60 * dt); st[3] = max(10f, st[3] - 0.1f / 60 * dt)
                  if (park) { parkTick(now, dt); return }
                  if (sleeping) { up(2, 2f * dt); if (st[2] >= 99f) sleeping = false; if (now - lastSp > 1000) { lastSp = now; pts.add(Pt("💤", px * W + 30, H * 0.45f, -H * 0.05f, 1f)) } }
                  if (aM >= 0) { if (now - aStart > 2400) { aM = -1; bath = false } else if (now - lastSp > 130) { lastSp = now; pts.add(Pt(D.fx[aFx], px * W + (rnd.nextFloat() - 0.5f) * W * 0.25f, H * (0.5f + 0.15f * rnd.nextFloat()), -H * 0.25f, 1f)) } }
                  else if (!sleeping) {
                      if (now > modeEnd) { val r = rnd.nextInt(10)
                          if (r < 4) { mode = "walk"; target = 0.2f + 0.6f * rnd.nextFloat(); modeEnd = now + 6000 }
                          else if (r < 7) { mode = "idle"; modeEnd = now + 3000 + rnd.nextInt(3000) }
                          else if (r < 9) { mode = "wag"; modeEnd = now + 2000 }
                          else { mode = "idle"; modeEnd = now + 2500; if (days() < 10) Snd.yip() else Snd.bark(bigF()) } }
                      if (mode == "walk") { val dx = target - px; if (abs(dx) < 0.01f) { mode = "idle"; modeEnd = now + 2000 } else { dir = if (dx > 0) 1 else -1; px += dir * 0.12f * dt } }
                  }
                  pts.forEach { it.y += it.vy * dt; it.life -= dt * 0.8f }; pts.removeAll { it.life <= 0 }
              }

              private fun dog(c: Canvas, key: String, nm: String, cx: Float, gy: Float, s: Float, dr: Int, m: FloatArray, wear: Boolean) {
                  val bm = Atlas.get(key, nm) ?: Atlas.get(key, "sit") ?: return
                  val w = bm.width * s; val h = bm.height * s; val x0 = -w / 2; val y0 = -h
                  c.save(); c.translate(cx + m[0] * w, gy + m[1] * h); c.rotate(m[2]); c.scale(dr * m[3], m[4])
                  p.isFilterBitmap = false
                  if (wear) D.wear(c, p, outfit, nm != "sit", x0, y0, w, h, 0)
                  c.drawBitmap(bm, null, RectF(x0, y0, x0 + w, 0f), p)
                  if (wear) D.wear(c, p, outfit, nm != "sit", x0, y0, w, h, 1)
                  c.restore()
              }
              private fun txt(c: Canvas, s: String, x: Float, y: Float, sz: Float, al: Paint.Align, col: Int = Color.BLACK) { tp.textSize = sz; tp.textAlign = al; tp.color = col; c.drawText(s, x, y, tp) }

              override fun onDraw(c: Canvas) {
                  val now = SystemClock.uptimeMillis(); val W = width.toFloat(); val H = height.toFloat(); tick(now, W, H)
                  p.style = Paint.Style.FILL
                  p.color = if (sleeping) 0xFF1B2440.toInt() else 0xFFBDE7F5.toInt(); c.drawRect(0f, 0f, W, H * 0.55f, p)
                  p.color = if (sleeping) 0xFF2E5B2E.toInt() else 0xFF7CC242.toInt(); c.drawRect(0f, H * 0.55f, W, H, p)
                  p.color = 0xFF8B5A2B.toInt(); c.drawRect(W * 0.82f, H * 0.25f, W * 0.85f, H * 0.55f, p); p.color = 0xFF3E9E3E.toInt(); c.drawCircle(W * 0.835f, H * 0.24f, W * 0.09f, p)
                  val d = days(); val adult = d >= 10; val sc = if (!adult) 0.45f + 0.55f * (d / 10f) else 0.8f + 0.2f * min(1f, (d - 10f) / 4f)
                  val key = D.breeds[breed].id + (if (adult) "_a" else "_p")
                  if (park) {
                      for (g in dogs.sortedBy { it.y }) {
                          val mine = g.bi == breed; val k = D.breeds[g.bi].id + (if (mine && !adult) "_p" else "_a"); val z = H * 0.0042f * (0.7f + 0.5f * g.y) * (if (mine) sc else 1f)
                          val nm = if (g.walking) "w" + ((now / 150) % Atlas.walks(k)).toInt() else "sit"
                          val m = floatArrayOf(0f, if (g.walking) -abs(sin(now / 100f)) * 0.03f else 0f, 0f, 1f, 1f)
                          dog(c, k, nm, g.x * W, g.y * H, z, if (nm == "sit") 1 else g.dir, m, mine)
                          val top = g.y * H - (Atlas.get(k, "sit")?.height ?: 60) * z - H * 0.01f
                          if (now < g.sayT) txt(c, g.say, g.x * W, top, H * 0.045f, Paint.Align.CENTER)
                          txt(c, (if (mine) "⭐ " + name else D.breeds[g.bi].name), g.x * W, g.y * H + H * 0.025f, H * 0.018f, Paint.Align.CENTER, Color.WHITE)
                      }
                      txt(c, "Parque · toca un perrito para ver su personalidad", W / 2, H * 0.05f, H * 0.02f, Paint.Align.CENTER)
                  } else {
                      val side = aM < 0 && !sleeping && (mode == "walk" || mode == "wag")
                      val nm = if (side && mode == "walk") "w" + ((now / 150) % Atlas.walks(key)).toInt() else if (side) "pb" else "sit"
                      val m = if (aM >= 0) D.motion(aM, min(1f, (now - aStart) / 2400f)) else if (sleeping) floatArrayOf(0f, 0f, 0f, 1f, 0.93f + 0.02f * sin(now / 400f))
                          else floatArrayOf(0f, if (mode == "walk") -abs(sin(now / 100f)) * 0.03f else 0f, 0f, 1f, 1f)
                      val s = H * 0.0045f * sc; val gy = H * 0.74f
                      dog(c, key, nm, px * W, gy, s, if (nm == "sit") 1 else dir, m, true)
                      if (bath) { p.color = 0x884FC3F7.toInt(); c.drawRoundRect(px * W - W * 0.3f, gy - H * 0.08f, px * W + W * 0.3f, gy + H * 0.03f, 30f, 30f, p) }
                      if (sleeping) { p.color = 0x55000022; c.drawRect(0f, 0f, W, H, p) }
                      for (q in pts) txt(c, q.e, q.x, q.y, H * 0.05f, Paint.Align.CENTER, Color.argb((255 * max(0f, q.life)).toInt(), 0, 0, 0))
                      txt(c, "$name · ${D.breeds[breed].name} · ${stage()} (día ${days().toInt()})", W * 0.04f, H * 0.04f, H * 0.024f, Paint.Align.LEFT)
                      val lab = listOf("🍖", "😊", "⚡", "🫧"); val cols = intArrayOf(0xFFEF6C00.toInt(), 0xFFE91E63.toInt(), 0xFFFDD835.toInt(), 0xFF29B6F6.toInt())
                      for (i in 0..3) { val y = H * (0.07f + 0.04f * i); txt(c, lab[i], W * 0.04f, y + H * 0.018f, H * 0.024f, Paint.Align.LEFT)
                          p.color = 0x55000000; c.drawRect(W * 0.12f, y, W * 0.42f, y + H * 0.02f, p); p.color = cols[i]; c.drawRect(W * 0.12f, y, W * (0.12f + 0.3f * st[i] / 100f), y + H * 0.02f, p) }
                  }
                  postInvalidateOnAnimation()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (e.action != MotionEvent.ACTION_UP) return true
                  if (park) {
                      val g = dogs.minByOrNull { hypot(it.x - e.x / width, it.y - e.y / height) } ?: return true
                      val P = D.pers[g.bi]; val t = dogs.firstOrNull { it.bi == g.tg }
                      toast("${D.breeds[g.bi].name}: ${P.t}. Ahora ${D.intN[g.ia]}" + (if (t != null && g.ia < 6) " a ${D.breeds[t.bi].name}" else ""))
                      if (g.bi == breed) Snd.happy() else Snd.yip()
                  } else if (sleeping) { sleeping = false; Snd.whine() } else act(0, rnd.nextInt(12), rnd.nextInt(4))
                  return true
              }

              fun load(sp: SharedPreferences) {
                  breed = sp.getInt("breed", 0); name = sp.getString("name", "Perrita") ?: "Perrita"; birth = sp.getLong("birth", System.currentTimeMillis()); last = sp.getLong("last", System.currentTimeMillis())
                  for (i in 0..3) st[i] = sp.getFloat("st$i", 80f); for (i in 0..6) { outfit[i] = sp.getInt("o$i", -1); inPark[i] = sp.getBoolean("p$i", true) }
                  val mins = min(600f, (System.currentTimeMillis() - last) / 60000f)
                  st[0] = max(10f, st[0] - 0.25f * mins); st[1] = max(10f, st[1] - 0.2f * mins); st[2] = max(10f, st[2] - 0.15f * mins); st[3] = max(10f, st[3] - 0.1f * mins)
              }
              fun save(sp: SharedPreferences) {
                  val ed = sp.edit().putInt("breed", breed).putString("name", name).putLong("birth", birth).putLong("last", System.currentTimeMillis())
                  for (i in 0..3) ed.putFloat("st$i", st[i]); for (i in 0..6) { ed.putInt("o$i", outfit[i]); ed.putBoolean("p$i", inPark[i]) }
                  ed.apply()
              }
          }
