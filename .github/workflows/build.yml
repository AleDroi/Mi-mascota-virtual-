                  fun btn(t: String, f: () -> Unit) { bar.addView(Button(this).apply { text = t; isAllCaps = false; setOnClickListener { f() } }) }
                  btn("🍖 Comer") { pick("Comida (${D.fBase.size * D.fPrep.size} combinaciones)", D.fBase) { a -> pick("Preparación", D.fPrep) { b -> g.feed(a, b) } } }
                  D.cats.forEachIndexed { i, c -> btn(c.title) { g.setPark(false); pick(c.title, c.a) { a -> if (c.b.size <= 1) g.act(i, a, 0) else pick(c.tb, c.b) { b -> g.act(i, a, b) } } } }
                  btn("👕 Ropa") { wardrobe() }
                  btn("🐕 Parque") { g.setPark(!g.park) }
                  btn("☰ Más") { menu() }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(g, LinearLayout.LayoutParams(-1, 0, 1f))
                      addView(HorizontalScrollView(this@MainActivity).apply { addView(bar) })
                  })
                  if (!sp.contains("breed")) chooseBreed(true)
              }
              private fun wardrobe() {
                  pick("Ropa · ${D.total} prendas", listOf("🎲 Outfit aleatorio", "🧹 Quitar todo") + D.slots) { i ->
                      if (i == 0) g.randomOutfit() else if (i == 1) g.outfit.fill(-1) else {
                          val sl = i - 2; val names = listOf("(Quitar)") + (0 until D.nShapes[sl]).map { D.shapeName(sl, it) }
                          pick(D.slots[sl], names) { j -> if (j == 0) g.outfit[sl] = -1 else pick("Color", D.colors.map { it.first }) { c -> g.outfit[sl] = (j - 1) * 7 + c } } } }
              }
              private fun chooseBreed(first: Boolean) {
                  pick(if (first) "¡Elige tu mascota!" else "Cambiar raza", D.breeds.map { it.name + " · " + D.pers[D.breeds.indexOf(it)].t }) { i -> g.newPet(i); if (first) askName() }
              }
              private fun askName() {
                  val e = EditText(this).apply { setText(g.name) }
                  AlertDialog.Builder(this).setTitle("¿Cómo se llama?").setView(e).setPositiveButton("Listo") { _, _ -> g.name = e.text.toString().ifBlank { "Perrita" } }.show()
              }
              private fun menu() {
                  pick("Más", listOf("🐕 Cambiar raza (mantiene edad y ropa)", "✏️ Cambiar nombre", "👥 Elegir quién va al parque", "⏩ Crecer 1 día (prueba)")) { i ->
                      when (i) { 0 -> chooseBreed(false); 1 -> askName(); 3 -> g.grow()
                          2 -> AlertDialog.Builder(this).setTitle("Al parque van:").setMultiChoiceItems(D.breeds.map { it.name }.toTypedArray(), g.inPark) { _, w, ch -> g.inPark[w] = ch }
                              .setPositiveButton("Listo") { _, _ -> if (g.park) g.setPark(true) }.show() } }
              }
              override fun onPause() { g.save(sp); super.onPause() }
          }
