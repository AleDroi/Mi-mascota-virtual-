          class Breed(val id: String, val name: String, val big: Float)
          class Pers(val t: String, val soc: Float, val ene: Float, val bra: Float, val dom: Float, val ter: Float)
          class Cx(val title: String, val tb: String, val a: List<String>, val b: List<String>)
          object D {
              val breeds = listOf(Breed("negra", "Negrita", 0.4f), Breed("collie", "Border Collie", 0.6f), Breed("dalmata", "Dálmata", 0.7f),
                  Breed("husky", "Husky", 0.7f), Breed("samoyedo", "Samoyedo", 0.6f), Breed("doberman", "Doberman", 1f), Breed("caniche", "Caniche", 0.3f))
              val pers = listOf(Pers("Cariñosa", 0.8f, 0.5f, 0.3f, 0.2f, 0.9f), Pers("Líder lista", 0.6f, 0.8f, 0.7f, 0.8f, 0.4f),
                  Pers("Traviesa", 0.9f, 0.95f, 0.6f, 0.5f, 0.3f), Pers("Aventurera dramática", 0.6f, 0.9f, 0.8f, 0.6f, 0.4f),
