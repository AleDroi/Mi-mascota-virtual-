          EOF
          mkdir -p $(dirname app/src/main/java/com/example/perrita/Atlas.kt)
          cat > app/src/main/java/com/example/perrita/Atlas.kt <<'EOF'
          package com.example.perrita
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          object Atlas {
              private val m = HashMap<String, Bitmap>()
              private val nw = HashMap<String, Int>()
              fun load(c: Context) {
                  if (m.isNotEmpty()) return
                  c.assets.open("atlas.txt").bufferedReader().readLines().forEach { ln ->
                      val parts = ln.split("|"); val key = parts[0]
                      val at = BitmapFactory.decodeStream(c.assets.open("$key.png"))
                      var n = 0
                      parts[1].split(";").forEach { e ->
                          val q = e.split(":")
                          m["$key/${q[0]}"] = Bitmap.createBitmap(at, q[1].toInt(), q[2].toInt(), q[3].toInt(), q[4].toInt())
                          if (q[0][0] == 'w') n++
                      }
                      nw[key] = max(1, n)
                  }
              }
              private fun max(a: Int, b: Int) = if (a > b) a else b
              fun get(key: String, nm: String) = m["$key/$nm"]
              fun walks(key: String) = nw[key] ?: 1
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/example/perrita/D.kt)
